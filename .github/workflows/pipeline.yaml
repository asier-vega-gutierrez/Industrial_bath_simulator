name: GitHub Actions Demo
run-name: Cpp custom pipeline
on: [push]

jobs:

  build:

    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio privado
        run: |
          git clone https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git my-project
          cd my-project
          git status

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt install libyaml-cpp-dev
          sudo apt install -y cmake build-essential

      # - name: Configurar CMake
      #   run: |
      #     cd my-project
      #     cmake -B build -S . -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      # - name: Compilar makefile
      #   run: |
      #     cd my-project
      #     cd build
      #     cmake ..

      - name: Compilar proyecto
        run: |
          cd my-project
          rm -rf build
          cmake -B build -S . -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j$(nproc)


