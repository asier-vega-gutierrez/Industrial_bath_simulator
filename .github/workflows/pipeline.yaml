name: GitHub Actions Demo
run-name: Cpp custom pipeline
on: [push]

jobs:

  build:

    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio privado
        run: |
          git clone https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git my-project
          cd my-project
          git status

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt install -y cmake build-essential
          
      - name: Descargar yaml-cpp manualmente (Workaround)
        run: |
          cd my-project
          mkdir -p third_party
          curl -L https://github.com/jbeder/yaml-cpp/archive/refs/tags/0.8.0.tar.gz -o yaml-cpp.tar.gz
          tar -xzf yaml-cpp.tar.gz -C third_party/
          mv third_party/yaml-cpp-0.8.0 third_party/yaml-cpp
          rm yaml-cpp.tar.gz

      - name: Compilar proyecto
        run: |
          cd my-project
          rm -rf build CMakeCache.txt CMakeFiles _deps
          mkdir build
          cd build
          cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          make


